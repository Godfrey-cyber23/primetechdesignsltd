<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primetech OS | Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060a;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-2: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #8b95a7;
            --accent: #00D4FF;
            --accent-2: #7B2FFF;
            --gradient: linear-gradient(135deg, #00D4FF, #7B2FFF);
            --danger: #f44336;
            --success: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .bg-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            z-index: 0;
        }
        .blob-1 { top: -100px; left: -100px; background: var(--accent-2); }
        .blob-2 { bottom: -100px; right: -100px; background: var(--accent); }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .form-group input:focus { outline: none; border-color: var(--accent); }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--gradient);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
        }
        .btn-primary:hover { opacity: 0.9; }
        
        .btn-google {
            width: 100%;
            padding: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .btn-google:hover { background: rgba(255,255,255,0.1); }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-switch a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        
        .auth-view { display: none; animation: fadeIn 0.4s ease; }
        .auth-view.active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg {
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .error-msg { background: rgba(244,67,54,0.1); color: var(--danger); border: 1px solid rgba(244,67,54,0.2); }
        .success-msg { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        #recaptcha-container { margin-bottom: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<div class="auth-container">
    <div class="logo">
        <div class="logo-icon"><i class="fas fa-bolt"></i></div>
        Primetech OS
    </div>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="auth-view active">
        <h2 style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif;">Admin Login</h2>
        <div class="msg error-msg" id="loginError"></div>
        <form onsubmit="loginUser(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" required placeholder="admin@primetech.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>
        
        <div class="divider">OR</div>
        
        <button class="btn-google" onclick="loginWithGoogle()">
            <i class="fab fa-google" style="color: #ea4335;"></i> Continue with Google
        </button>
        <button class="btn-google" onclick="switchView('phoneView')">
            <i class="fas fa-phone" style="color: var(--accent);"></i> Continue with Phone
        </button>

        <div class="auth-switch">
            <a onclick="switchView('forgotView')">Forgot Password?</a> <br>
            Don't have an account? <a onclick="switchView('signupView')">Sign Up</a>
        </div>
    </div>

    <!-- SIGNUP VIEW -->
    <div id="signupView" class="auth-view">
        <h2 style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif;">Create Account</h2>
        <div class="msg error-msg" id="signupError"></div>
        <form onsubmit="signupUser(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" required placeholder="admin@primetech.com">
            </div>
            <div class="form-group">
                <label>Password (Min 6 characters)</label>
                <input type="password" id="signupPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>
        </form>
        <div class="auth-switch">
            Already have an account? <a onclick="switchView('loginView')">Sign In</a>
        </div>
    </div>

    <!-- PHONE VIEW -->
    <div id="phoneView" class="auth-view">
        <h2 style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif;">Phone Login</h2>
        <div class="msg error-msg" id="phoneError"></div>
        <div class="msg success-msg" id="phoneSuccess"></div>
        
        <div id="phoneFormStep">
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="+260975xxxxxx">
            </div>
            <div id="recaptcha-container"></div>
            <button class="btn-primary" id="sendCodeBtn" onclick="sendPhoneCode()">Send Verification Code</button>
        </div>

        <div id="phoneVerifyStep" style="display: none;">
            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" id="verificationCode" placeholder="6-digit code">
            </div>
            <button class="btn-primary" id="verifyCodeBtn" onclick="verifyPhoneCode()">Verify & Login</button>
        </div>

        <div class="auth-switch">
            <a onclick="switchView('loginView')">Back to Email Login</a>
        </div>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div id="forgotView" class="auth-view">
        <h2 style="margin-bottom: 20px; font-family: 'Space Grotesk', sans-serif;">Reset Password</h2>
        <div class="msg success-msg" id="forgotSuccess">Reset link sent! Check your email.</div>
        <div class="msg error-msg" id="forgotError"></div>
        <form onsubmit="resetPassword(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgotEmail" required placeholder="admin@primetech.com">
            </div>
            <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
        </form>
        <div class="auth-switch">
            <a onclick="switchView('loginView')">Back to Login</a>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
